# Netlify configuration for the Task-7 React app
[build]
  # Publish the build output from the Task-7 project
  publish = "build"
  # Install and build inside the Task-7 folder
  command = "npm install && npm run build"

[context.production.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
