<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Income Expense Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="noise min-h-screen text-slate-50 antialiased">
  <main class="w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <header class="mb-4 text-center">
      <h1 class="text-2xl font-semibold">Income Expense Calculator</h1>
      <p class="text-sm text-slate-300">Track income, expenses, and net balance.</p>
    </header>

    <!-- Summary -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="nb-card p-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 h-1 w-full bg-emerald-400/80"></div>
        <div class="text-sm text-slate-300">Total Income</div>
        <div id="totalIncome" class="mt-2 text-xl font-bold">₹0.00</div>
      </div>

      <div class="nb-card p-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 h-1 w-full bg-rose-400/80"></div>
        <div class="text-sm text-slate-300">Total Expense</div>
        <div id="totalExpense" class="mt-2 text-xl font-bold">₹0.00</div>
      </div>

      <div class="nb-card p-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 h-1 w-full bg-cyan-400/80"></div>
        <div class="text-sm text-slate-300">Net Balance</div>
        <div id="netBalance" class="mt-2 text-xl font-bold">₹0.00</div>
      </div>
    </section>

    <!-- Form -->
    <section class="nb-panel p-5 sm:p-6 mb-6">
      <h2 id="formTitle" class="text-lg font-medium mb-3">Add Entry</h2>

      <form id="entryForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start" autocomplete="off">
        <div class="space-y-2">
          <label class="text-sm text-slate-300" for="description">Description</label>
          <input id="description" type="text" placeholder="e.g., Salary / Groceries" required
            class="w-full rounded-lg bg-slate-900/60 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>

        <div class="space-y-2">
          <label class="text-sm text-slate-300" for="amount">Amount</label>
          <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g., 1500" required
            class="w-full rounded-lg bg-slate-900/60 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
          <p class="text-xs text-slate-400">Enter a positive value</p>
        </div>

        <div class="md:col-span-2 flex flex-wrap items-center gap-4">
          <div class="text-sm text-slate-300">Type</div>
          <label class="inline-flex items-center gap-2"><input type="radio" name="type" value="income" checked class="accent-sky-400" /> <span>Income</span></label>
          <label class="inline-flex items-center gap-2"><input type="radio" name="type" value="expense" class="accent-rose-400" /> <span>Expense</span></label>
        </div>

        <div class="md:col-span-2 flex flex-wrap gap-3">
          <button type="submit" id="submitBtn" class="nb-btn rounded-xl px-4 py-2 font-semibold bg-cyan-300 text-slate-950">Add</button>
          <button type="button" id="resetBtn" class="nb-btn rounded-xl px-4 py-2 font-semibold bg-white/5 border border-white/20 text-slate-50">Reset</button>
          <button type="button" id="cancelEditBtn" class="nb-btn rounded-xl px-4 py-2 font-semibold bg-white/5 border border-white/20 text-slate-50 hidden">Cancel Edit</button>
          <p id="errorMsg" class="text-sm text-rose-300 hidden"></p>
        </div>
      </form>
    </section>

    <!-- Filters + List -->
    <section class="nb-panel p-5 sm:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
        <h2 class="text-lg font-medium">Entries</h2>
        <div class="flex flex-wrap gap-3 items-center sm:justify-end">
          <label class="nb-btn inline-flex items-center gap-2 rounded-full px-3 py-1.5 bg-white/5 border border-white/15 cursor-pointer"><input type="radio" name="filter" value="all" checked class="accent-cyan-300" /> <span class="ml-2">All</span></label>
          <label class="nb-btn inline-flex items-center gap-2 rounded-full px-3 py-1.5 bg-white/5 border border-white/15 cursor-pointer"><input type="radio" name="filter" value="income" class="accent-cyan-300" /> <span class="ml-2">Income</span></label>
          <label class="nb-btn inline-flex items-center gap-2 rounded-full px-3 py-1.5 bg-white/5 border border-white/15 cursor-pointer"><input type="radio" name="filter" value="expense" class="accent-rose-300" /> <span class="ml-2">Expense</span></label>
        </div>
      </div>

      <ul id="entryList" class="grid gap-3"></ul>

      <p id="emptyState" class="text-sm text-slate-400 mt-3">No entries yet. Add your first one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
